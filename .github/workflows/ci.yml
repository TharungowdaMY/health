name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: delta
          POSTGRES_PASSWORD: delta
          POSTGRES_DB: delta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delta -d delta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DELTA_HEALTH_DB: postgresql+psycopg2://delta:delta@localhost:5432/delta_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -v

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t delta-health ./backend
